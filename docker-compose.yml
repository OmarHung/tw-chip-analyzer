# tw_chip_analyzer 完整堆疊:PostgreSQL + 後端 API + 前端 Web。
#
# 前置:  cp deploy/docker/env.example .env   # compose 自動讀根目錄 .env
#        編輯 .env 填 POSTGRES_PASSWORD 與 NEXT_PUBLIC_API_BASE(公開網域)
# 啟動:  docker compose up -d --build
# 灌史:  docker compose run --rm api ./scripts/eod.sh 2026-09-04   # 逐日補歷史
# 排程:  api 內建 APScheduler 每交易日 14:30(Asia/Taipei)自動跑,無需額外容器。
#
# API/Web 只綁 127.0.0.1,對外請用主機 nginx(deploy/nginx/twchip.conf)+ certbot
# 做同源代理與 TLS(免 CORS)。詳見 deploy/README.md 的 Docker 一節。

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: twchip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設 POSTGRES_PASSWORD}
      POSTGRES_DB: twchip
      TZ: Asia/Taipei
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twchip -d twchip"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # 用固定公用 DNS 解析外部主機(TWSE/TDCC/Yahoo)。避免主機 resolv.conf 被
    # Tailscale MagicDNS 接管後只答 *.ts.net、導致容器抓不到市場資料。
    # (service 名如 db/api 仍由 Docker 內建解析器處理,不受影響。)
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      APP_ENV: prod
      # 密碼不塞進 URL(避免含 @ : / 等 URL 保留字元被誤解析);
      # 改由 PGPASSWORD 傳給 psycopg/libpq,任意特殊字元皆安全。
      DATABASE_URL: postgresql+psycopg://twchip@db:5432/twchip
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Shioaji 逐筆(選用);留空則 intraday 中性
      SJ_API_KEY: ${SJ_API_KEY:-}
      SJ_SEC_KEY: ${SJ_SEC_KEY:-}
      SJ_CA_PATH: ${SJ_CA_PATH:-}
      SJ_CA_PASSWD: ${SJ_CA_PASSWD:-}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:?請在 .env 設 NEXT_PUBLIC_API_BASE}
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
      # SSR(server component)在容器內直連 api 服務,免繞公開網域/ts.net。
      # 瀏覽器仍用上面的 NEXT_PUBLIC_API_BASE。
      API_BASE_INTERNAL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  pgdata:

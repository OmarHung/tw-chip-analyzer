# tw_chip_analyzer nginx 反向代理:前端(:3000)與後端(:8000)同源。
# 同源代理 → 瀏覽器與 SSR 皆走同網域,免 CORS(後端 CORS 只放行 localhost)。
#
# 安裝:
#   sudo apt update && sudo apt install -y nginx        # 若尚未安裝
#   sudo cp deploy/nginx/twchip.conf /etc/nginx/sites-available/twchip
#   sudo sed -i 's/__DOMAIN__/你的網域/g' /etc/nginx/sites-available/twchip
#   sudo ln -s /etc/nginx/sites-available/twchip /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d 你的網域          # 自動補上 443/TLS 區塊

server {
    listen 80;
    server_name __DOMAIN__;

    # 後端 API(FastAPI)。/api 前綴與後端 router prefix 一致。
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # 背離掃描冷啟可能數秒
    }

    # 前端(Next.js)。含 HMR/websocket 升級(prod 用不到,保留無害)。
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

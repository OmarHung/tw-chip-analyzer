# 交易/籌碼門檻設定 — 對應 docs/07-ops-config.md §21
# 所有 threshold 一律 config 化，程式禁止硬編碼 magic number。

# chip_score 映射方式(散度修復,見 docs/03 §10 補充):
# percentile = 當日全市場橫斷面百分位(0~100,分布均勻,高分 bucket 可回測;
#              rank-preserving,不改變 IC)。linear = 50+50*composite(舊制,
#              z 合成回歸中性、天花板 ~64,高分區永遠無樣本)。
scoring:
  mapping: percentile

signal:
  buy_score: 75
  watch_score: 65
  reduce_score: 50
  exit_score: 40

risk:
  atr_stop_multiplier: 1.5
  swing_buffer_atr: 0.2
  max_stop_pct: 0.06
  tp1_r: 2.0
  tp2_r: 3.0
  entry_low_atr: 0.25    # entry zone 下緣 = last - 0.25 ATR
  entry_high_atr: 0.15   # entry zone 上緣 = last + 0.15 ATR
  min_risk_pct: 0.01     # 風險分母下限(佔進場價比例),避免停損貼近時 RR 爆大
  # RR 目標(docs/09 BUG-01):TP1/TP2 是 R 倍數風控目標,不可同時當 RR gate 的證據
  # (RR 會恆等於 tp1_r)。RR = (壓力位 − 進場區上緣) ÷ (進場區上緣 − 停損)。
  resistance_lookback_bars: 60   # 壓力位 = 近 N 根(後復權)最高價
  resistance_min_bars: 20        # 不足此數無壓力位 → RR=0(保守,不給 BUY)
  # 已突破壓力位(壓力 <= 進場區上緣)時的目標 = 進場區上緣 + k × ATR。
  # 未經回測驗證的初始值,之後以 backtest 檢視。
  breakout_target_atr: 4.0

# feature_builder 價格載入視窗(日曆日);須涵蓋 resistance_lookback_bars 根交易日
features:
  price_window_days: 100
  # 固定視窗(交易日根數)。不足即 NULL,不以較短資料冒充(docs/09 BUG-10、docs/12 Phase 6)
  flow_window_bars: 5          # 法人淨額 / 融資券餘額變化 / 5 日報酬
  ma_bars: 20                  # MA20、20 日均量
  atr_period: 14               # ATR 期數(所需 bar = period + 1)
  swing_low_bars: 10           # 近期波段低點
  sbl_lookback_bars: 20        # 借券餘額百分比變化(OOS 上 20D > 5D)
  industry_min_members: 5      # 產業成分股不足此數不給產業趨勢分
  # 橫斷面 z 的離群值處理:先把原始值截在 [q, 1-q] 分位,再 z,最後 z 夾在 ±z_clip。
  # 實測 2026-09-08 單一標的外資 z=44.1,把其餘 1900 檔壓在 |z|<0.3,因子形同失效。
  winsorize_quantile: 0.01
  z_clip: 5.0

entry_filter:
  # 鎖死漲停(docs/09 BUG-03):漲幅 >= 此值 且 最高=最低=收盤 → 無法合理成交。
  # 台股漲停 10% 以參考價依升降單位取整,實際漲幅略低於 10%,故取 9.5%。
  limit_lock_min_change_pct: 0.095
  min_risk_reward: 2.0
  max_vwap_deviation_pct: 0.08   # 收盤價不可高於 VWAP 逾 8%
  max_ma20_deviation_pct: 0.12   # 收盤價不可高於 MA20 逾 12%
  min_turnover: 20000000         # 最低成交金額(流動性門檻)，單位 TWD
  # 原始 market_trend_score(-1..1,未乘 Chip Score 市場權重) <= 此值視為 Strong Bear，禁止 BUY
  strong_bear_market_score: -0.5

exit:
  # Distribution Warning：價創高但買盤/大單背離、上方賣壓增。
  # 預設關閉(docs/12 Phase 3A):需要單股時序 CVD slope、單股 raw 大單淨額、可證明「增加中」的
  # 買方吸收三者皆有定義並經多日逐筆驗證後才可開啟;不得以橫斷面 z 值替代。
  distribution_enabled: false
  distribution_cvd_slope_max: 0.0
  distribution_large_delta_max: 0.0

large_trade:
  percentile: 0.95
  min_samples: 500

# 盤中逐筆批次匯入範圍（見 docs/07 §21）。避免 Shioaji 資料配額爆量，
# 只抓當日成交金額前 N 檔且 >= 門檻的標的，非全市場。
intraday_batch:
  max_symbols: 200          # 依當日 turnover 由高到低取前 N 檔
  min_turnover: 20000000    # 成交金額下限（TWD），低於此不抓逐筆
  throttle_ms: 200          # 每檔之間的節流（毫秒），降低配額/連線壓力
  usage_stop_pct: 95        # api.usage() 用量達此百分比即停止批次
  max_consecutive_failures: 10  # 連續抓取失敗達此檔數即停(token 過期/斷線時別繼續燒配額)

# 系統頁「工作」按鈕執行的腳本（app/jobs/tasks.py 白名單，子行程執行）
jobs:
  # 子行程 nice 值(0~19,越大越讓出 CPU)。線上 1 vCPU:重建期間 API/網頁仍需回應
  nice: 10
  output_max_chars: 200000   # 存入 job_run 的輸出上限(保留尾端)
  cancel_grace_sec: 5        # 取消時 SIGTERM 後等待秒數,逾時 SIGKILL

tdcc:
  retail_max_lots: 50
  large_min_lots: 400
  super_large_min_lots: 1000
  # 切換「真實 week-over-week change」的涵蓋率門檻:視窗內有 >=2 週快照的個股
  # 佔當日全市場的比例。低於門檻維持 level proxy(全市場一致)——否則部分回補
  # (scripts/backfill_tdcc.py 只補重點標的)會讓少數股票觸發 change 模式,而多數
  # 只有 1 週的股票算不出 change、holder 成分被整個排除,等於全市場掉一個維度。
  change_coverage_min: 0.5
  # 揭露落後天數(日曆日):TDCC 以每週最後營業日收盤後統計,實際公布在數日之後。
  # available_at = 資料日 + 此天數(盤後 18:00)。鐵則 8:禁止提前使用——快照日當天
  # 就拿來算特徵等於偷看未來,backtest 會虛胖。取 5 天(週五→下週三)保守側。
  disclosure_lag_days: 5

# 主力進出 vs 股價「量價背離」偵測(前端主力進出面板的背離卡)。
# 鐵則 4/5:門檻 config 化、禁 magic number;鐵則 6:主力淨買超以「佔區間成交比重」正規化,
# 而非直接比張數,故跨股票可比。price_eps/flow_eps 是判定「顯著」的最小幅度。
divergence:
  windows: [20, 60]        # 觀察窗(交易日);短窗抓轉折、長窗看趨勢
  price_eps: 0.03          # 區間報酬達 ±3% 才算價格「明顯」漲/跌
  flow_eps: 0.02           # 主力淨買超佔區間成交比重達 ±2% 才算主力「明顯」進/出
  min_points: 10           # 窗內有效樣本不足此數則不判定(回 null)

# 主力估算成本(移動加權平均成本法):淨買日用當日 VWAP 加權更新持倉均價,
# 淨賣日減倉、均價不變(減至 0 則重置)。純估算,僅反映窗內觀察到的累積。
cost_basis:
  state_eps: 0.01          # 現價相對估算成本 ±1% 內視為打平(避免雜訊誤判浮盈/套牢)

# 每日盤後 EOD 排程(app.jobs.scheduler;鐵則 4:排程時間 config 化,禁硬編碼)
schedule:
  enabled: true            # 隨 API server(FastAPI lifespan)自動起停;test env 一律不啟動
  timezone: Asia/Taipei
  eod:
    day_of_week: "mon-fri"   # 交易日;國定假日由 daily 偵測無 OHLCV 自動空跑
    hour: 14
    minute: 30

# Backtest — 對應 docs/06 §17-18、docs/08 §31
backtest:
  # 交易成本(台股)。禁止 0 成本回測。每邊各收一次手續費，賣出加證交稅。
  costs:
    fee_rate: 0.001425      # 券商手續費，單邊
    tax_rate: 0.003         # 證交稅，僅賣出
    slippage_pct: 0.001     # 滑價，單邊
  horizons: [1, 3, 5, 10, 20]    # forward return 天數(交易日)
  entry_price: open              # 進場價：entry bar 的 open|close
  # 進場 bar = data_date 之後第一根 bar（look-ahead 安全，訊號於收盤後才可得）
  score_buckets:                 # [下界, 上界)
    - [50, 60]
    - [60, 70]
    - [70, 80]
    - [80, 90]
    - [90, 101]
  score_thresholds: [60, 65, 70, 75, 80, 85]
  success:                       # 第一版成功定義
    horizon: 5
    min_mfe: 0.06
    max_mae: 0.04

# 前瞻驗證(/validation)統計口徑
validation:
  min_ic_names: 20        # 當日橫斷面至少幾檔才計入 rank IC

# Composite Chip Score 權重 — 對應 docs/03 §10
weights:
  composite:
    intraday: 0.35
    institutional: 0.30
    holder: 0.25
    market: 0.10
  intraday:
    large_trade_delta: 0.30
    cvd: 0.25
    absorption: 0.20
    # CVD 斜率(每分鐘量正規化)。原名 obi 但並非委買委賣量失衡——目前無五檔量資料,
    # 真 OBI 留待 realtime order book(docs/12 Phase 3B)。權重未調整。
    cvd_slope: 0.10
    trade_speed: 0.10
    price_efficiency: 0.05
  institutional:
    trust: 0.30
    foreign: 0.25
    dealer: 0.10
    margin_change: -0.15
    # SBL 特徵已接線(feature_builder),但依紀律「未經 OOS 驗證不進分數」先取 0;
    # 原設計 -0.10,待借券累積 >=2 個月跑 sbl_factor_oos 驗證後再啟用。
    sbl_change: 0.0
    short_change: -0.10
  holder:
    large_holder_change: 0.60
    retail_holder_change: -0.25
    holder_count_change: -0.15
  market:
    market_trend: 0.65
    # 產業趨勢:資料已接(feature_daily.industry_trend_score),但 OOS 未過關——
    # 2026-09-09 實跑 train IC +0.059 → test +0.028、t=0.62(有效 test 日僅 25),
    # 方向一致但不顯著。比照 SBL 紀律:未經 OOS 驗證不進分數,故權重 0。
    # market_trend 刻意維持 0.65 不補到 1.0——保持與歷史分數同尺度(產業別接線前
    # 的行為就是「industry 分項恆 0、權重 0.35」),避免整段歷史分數不可比。
    # 累積跨 regime 資料後重驗(方法見 scripts/sbl_factor_oos.py),過關再開回 0.35。
    industry_trend: 0.0

# 大盤 regime 計算（market_trend_score，見 docs/03 §10）
market_regime:
  ma_short_bars: 20      # 短均線(MA20)
  ma_long_bars: 60       # 長均線(MA60)
  slope_lookback_bars: 5 # 短均線斜率回看根數
  volatility_bars: 20    # 報酬波動回看根數
  above_ma20: 0.25       # TAIEX > MA20
  above_ma60: 0.20       # TAIEX > MA60
  ma20_slope: 0.20       # MA20 斜率（正規化）
  breadth: 0.25          # 漲跌家數
  volatility: 0.10       # 波動 regime（高波動偏空）
  slope_scale: 0.02      # ma20_slope 正規化：日斜率/MA20 * 60 天 → tanh
  high_vol_pct: 0.03     # 近 20 日報酬標準差 > 3% 視為高波動
